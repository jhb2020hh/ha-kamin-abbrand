name: "Kamin Abbrand"
version: "0.3.7"
slug: kamin_abbrand
url: "https://github.com/jhb2020hh/ha-kamin-abbrand"
description: "Abbrandüberwachung und Klappensteuerung für den Kaminofen, mit Kostenvergleich und Wasserseite. Startet im Modus Lauschen."
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# init bleibt beim Standard (true): Das Abbild hat kein S6 overlay, Docker stellt
# den Init-Prozess. init: false ist nur für Abbilder mit S6 overlay vorgesehen.
stage: experimental
homeassistant_api: true
hassio_api: true
discovery:
  - kamin_abbrand
ingress: true
ingress_port: 8099
panel_icon: mdi:fireplace
panel_title: Kamin
# /config im Container = /addon_configs/<slug> auf dem Host, per SSH lesbar. /data wäre es nicht.
map:
  - addon_config:rw
  # Nur für den Ordner custom_components/kamin_abbrand, siehe anbindung/bereitstellung.py.
  - homeassistant_config:rw
# Der Verlauf kann einige Hundert MB erreichen und gehört nicht in jede Sicherung.
backup_exclude:
  - "*.jsonl"
options:
  log_stufe: info
  helfer_praefix: kamin_abbrand
schema:
  log_stufe: list(debug|info|warning|error)
  helfer_praefix: match(^[a-z0-9_]+$)
